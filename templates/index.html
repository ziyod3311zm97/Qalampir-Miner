<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Qalampir Miner Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 28, 38, 0.7);
            --primary-orange: #ff5e00;
            --neon-glow: #ff3300;
            --accent-green: #00ff88;
            --text-main: #ffffff;
            --text-dim: #8e9aaf;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            background: radial-gradient(circle at top, #1f0b08 0%, #0b0e14 70%);
        }

        /* Header Info */
        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .stat-val {
            font-weight: 800;
            font-size: 1.1rem;
            color: #fff;
        }

        /* Balance Display */
        .score-container {
            text-align: center;
            margin-top: 10px;
        }

        .score-title {
            font-size: 0.85rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .score-val {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(180deg, #ffffff 0%, #ffaa00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 94, 0, 0.4);
        }

        /* Main Clicker Area */
        .clicker-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        .pepper-glow {
            position: absolute;
            width: 230px;
            height: 230px;
            background: radial-gradient(circle, var(--neon-glow) 0%, transparent 70%);
            filter: blur(30px);
            opacity: 0.5;
            animation: pulse 2s infinite alternate;
        }

        .pepper-btn {
            position: relative;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #ff3b00 0%, #800d00 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(255, 60, 0, 0.5), inset 0 2px 10px rgba(255,255,255,0.4);
            transition: transform 0.05s ease;
            outline: none;
        }

        .pepper-btn:active {
            transform: scale(0.92);
        }

        .pepper-icon {
            font-size: 110px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        /* Floating +1 Text */
        .floating-num {
            position: absolute;
            font-size: 2rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px var(--primary-orange);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }

        /* Energy & Progress Bar */
        .energy-wrapper {
            padding: 0 25px 15px 25px;
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff3300, #ff8800, var(--accent-green));
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        /* Tab Content Pages */
        .page {
            display: none;
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .page.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Bottom Navigation */
        .navbar {
            background: rgba(15, 20, 28, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.2s;
            width: 25%;
        }

        .nav-item i {
            font-size: 1.3rem;
        }

        .nav-item.active {
            color: var(--primary-orange);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.15); opacity: 0.7; }
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }
    </style>
</head>
<body>

    <!-- Header Stats -->
    <div class="header">
        <div class="stat-card">
            <i class="fa-solid fa-fire" style="color: var(--primary-orange);"></i>
            <div>
                <div style="font-size: 0.7rem; color: var(--text-dim);">Kuch</div>
                <div class="stat-val" id="clickPower">+1</div>
            </div>
        </div>
        <div class="stat-card">
            <i class="fa-solid fa-trophy" style="color: #ffcc00;"></i>
            <div>
                <div style="font-size: 0.7rem; color: var(--text-dim);">Liga</div>
                <div class="stat-val">Bronza</div>
            </div>
        </div>
    </div>

    <!-- TAB 1: MINER MAIN PAGE -->
    <div id="page-miner" class="page active">
        <div class="score-container">
            <div class="score-title">BALANS</div>
            <div class="score-val" id="balance">0</div>
        </div>

        <div class="clicker-area">
            <div class="pepper-glow"></div>
            <div class="pepper-btn" id="clickBtn">
                <span class="pepper-icon">🌶️</span>
            </div>
        </div>

        <div class="energy-wrapper">
            <div class="energy-info">
                <span><i class="fa-solid fa-bolt" style="color: #ffaa00;"></i> Energiya</span>
                <span id="energyText">1000/1000</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="energyFill"></div>
            </div>
        </div>
    </div>

    <!-- TAB 2: PASS (Tasks & Quests) -->
    <div id="page-pass" class="page">
        <h2 style="margin-bottom: 15px;">Mavsumiy Vazifalar</h2>
        <div class="card">
            <div>
                <div style="font-weight: bold;">Telegram Kanalga a'zo bo'lish</div>
                <div style="color: var(--accent-green); font-size: 0.85rem;">+5,000 Balans</div>
            </div>
            <button style="padding: 8px 15px; border-radius: 10px; border:none; background: var(--primary-orange); color:#fff; font-weight:bold;">Bajarish</button>
        </div>
    </div>

    <!-- TAB 3: DO'KON (Boosters) -->
    <div id="page-shop" class="page">
        <h2 style="margin-bottom: 15px;">Boosterlar va Kuchaytirish</h2>
        <div class="card">
            <div>
                <div style="font-weight: bold;">Multitap (+1 Bosish)</div>
                <div style="color: #ffaa00; font-size: 0.85rem;">Narxi: 1,000 Balans</div>
            </div>
            <button style="padding: 8px 15px; border-radius: 10px; border:none; background: var(--accent-green); color:#000; font-weight:bold;">Sotib olish</button>
        </div>
    </div>

    <!-- TAB 4: XALTA (Inventory) -->
    <div id="page-bag" class="page">
        <h2 style="margin-bottom: 15px;">Sizning Inventaringiz</h2>
        <p style="color: var(--text-dim);">Hozircha inventaringiz bo'sh.</p>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="navbar">
        <div class="nav-item active" onclick="switchTab('miner', this)">
            <i class="fa-solid fa-pickaxe"></i>
            <span>Miner</span>
        </div>
        <div class="nav-item" onclick="switchTab('pass', this)">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Pass</span>
        </div>
        <div class="nav-item" onclick="switchTab('shop', this)">
            <i class="fa-solid fa-store"></i>
            <span>Do'kon</span>
        </div>
        <div class="nav-item" onclick="switchTab('bag', this)">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>Xalta</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let userId = tg.initDataUnsafe?.user?.id || 123456;
        let username = tg.initDataUnsafe?.user?.first_name || "Player";

        let balance = 0;
        let energy = 1000;
        let maxEnergy = 1000;
        let clickPower = 1;
        let unsyncedClicks = 0;

        // API Init
        fetch('/api/init', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({user_id: userId, username: username})
        })
        .then(res => res.json())
        .then(data => {
            balance = data.balance;
            energy = data.energy;
            maxEnergy = data.max_energy;
            clickPower = data.click_power;
            updateUI();
        });

        const clickBtn = document.getElementById('clickBtn');

        clickBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for(let i=0; i<e.touches.length; i++) {
                handleTap(e.touches[i].clientX, e.touches[i].clientY);
            }
        });

        clickBtn.addEventListener('click', (e) => {
            handleTap(e.clientX, e.clientY);
        });

        function handleTap(x, y) {
            if (energy >= clickPower) {
                balance += clickPower;
                energy -= clickPower;
                unsyncedClicks += 1;

                showFloatingNum(x, y, `+${clickPower}`);
                updateUI();
            }
        }

        function showFloatingNum(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-num';
            el.innerText = text;
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 40}px`;
            document.body.appendChild(el);

            setTimeout(() => el.remove(), 800);
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance.toLocaleString();
            document.getElementById('energyText').innerText = `${energy}/${maxEnergy}`;
            document.getElementById('energyFill').style.width = `${(energy / maxEnergy) * 100}%`;
            document.getElementById('clickPower').innerText = `+${clickPower}`;
        }

        // Har 2 sekundda backend bilan sinxronizatsiya
        setInterval(() => {
            if (unsyncedClicks > 0) {
                fetch('/api/sync', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId, clicks: unsyncedClicks})
                });
                unsyncedClicks = 0;
            }
        }, 2000);

        // Tablarni almashtirish
        function switchTab(tabName, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`page-${tabName}`).classList.add('active');
            el.classList.add('active');
        }
    </script>
</body>
</html>
